<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t">
  <title id="t">Cartoon dollar sign logo</title>
  <rect width="800" height="600" rx="24" fill="#FAF7F2"/>
  <!-- sparkles -->
  <g fill="#D44500">
    <path d="M150 140 l12 30 30 12 -30 12 -12 30 -12 -30 -30 -12 30 -12z"/>
    <path d="M650 420 l9 22 22 9 -22 9 -9 22 -9 -22 -22 -9 22 -9z"/>
    <path d="M640 130 l7 17 17 7 -17 7 -7 17 -7 -17 -17 -7 17 -7z"/>
    <path d="M170 440 l6 15 15 6 -15 6 -6 15 -6 -15 -15 -6 15 -6z"/>
  </g>
  <!-- coin -->
  <circle cx="400" cy="300" r="215" fill="#1B2A41"/>
  <circle cx="400" cy="300" r="190" fill="#D44500"/>
  <circle cx="400" cy="300" r="170" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-dasharray="14 12"/>
  <!-- dollar sign -->
  <text x="400" y="385" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="260" fill="#FFFFFF" stroke="#1B2A41" stroke-width="10" paint-order="stroke">$</text>
  <!-- shine -->
  <path d="M290 190 q40 -50 110 -60" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" opacity="0.7"/>
</svg>
